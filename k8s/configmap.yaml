apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: oficina
data:
  NODE_ENV: "production"
  PORT: "3001"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "*"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  JWT_EXPIRES_IN: "1d"
  AWS_REGION: "us-east-1"
  # URLs de fila/tópico NÃO ficam aqui: o CI as publica no ConfigMap
  # `billing-service-messaging` a partir das saídas do Terraform (terraform/outputs.tf).
  MESSAGING_DRIVER: "sqs"
  MESSAGING_ENABLED: "true"
  OUTBOX_RELAY_INTERVAL_MS: "1000"
  # Mercado Pago (credenciais e secret do webhook ficam no Secret, vindos do SSM).
  PAYMENT_GATEWAY: "mercadopago"
  # Validade do link de pagamento; alinhar com SAGA_TIMEOUT_PAGAMENTO do OS (1h).
  PAGAMENTO_TTL_MINUTOS: "60"
  # Notificação de orçamento (ADR-005): "ses" no EKS.
  NOTIFICATION_PROVIDER: "ses"
  SES_FROM_EMAIL: "no-reply@oficina.com"
  NEW_RELIC_NO_CONFIG_FILE: "true"
  NEW_RELIC_LOG: "stdout"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
