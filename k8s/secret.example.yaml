# Template do Secret do Billing Service. NÃO aplique diretamente: documenta as chaves
# esperadas. O CI (.github/workflows/ci-cd.yml) monta o Secret real no deploy, lendo tudo
# do SSM Parameter Store e dos GitHub Secrets — nada fica em texto plano no repositório.
#
#   kubectl create secret generic billing-service-secret -n oficina \
#     --from-literal=DATABASE_URL=postgres://billing_service:SENHA@host:5432/oficina_billing \
#     --from-literal=JWT_SECRET=... --from-literal=INTERNAL_API_TOKEN=... --from-literal=WEBHOOK_SECRET=... \
#     --from-literal=MP_ACCESS_TOKEN=TEST-... --from-literal=MP_WEBHOOK_SECRET=... \
#     --from-literal=MP_NOTIFICATION_URL=https://<api-id>.execute-api.us-east-1.amazonaws.com/api/pagamentos/webhooks/mercadopago
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secret
  namespace: oficina
type: Opaque
stringData:
  DATABASE_URL: "postgres://billing_service:CHANGE_ME@CHANGE_ME:5432/oficina_billing"
  JWT_SECRET: "CHANGE_ME"
  INTERNAL_API_TOKEN: "CHANGE_ME"
  WEBHOOK_SECRET: "CHANGE_ME"
  MP_ACCESS_TOKEN: "TEST-CHANGE_ME"
  MP_WEBHOOK_SECRET: "CHANGE_ME"
  MP_NOTIFICATION_URL: "https://CHANGE_ME/api/pagamentos/webhooks/mercadopago"
  NEW_RELIC_LICENSE_KEY: ""
  NEW_RELIC_APP_NAME: "billing-service"
