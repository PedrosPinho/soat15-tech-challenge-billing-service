# SonarQube LOCAL (Fase 4). Servidor: `docker compose -f docker-compose.sonar.yml up -d` (repo OS).
# Análise dos 3 serviços: `./scripts/sonar-local.sh` (roda os testes com cobertura e envia o lcov).
# No CI, o job `Sonar` só roda se existirem a variável SONAR_HOST_URL e o secret SONAR_TOKEN.
sonar.projectKey=soat15-tech-challenge-billing-service
sonar.projectName=soat15-tech-challenge-billing-service

sonar.sources=src
sonar.tests=tests
sonar.inclusions=src/**/*.ts
sonar.test.inclusions=tests/**/*.spec.ts,tests/**/*.test.ts
sonar.exclusions=node_modules/**,dist/**,coverage/**,src/index.ts,**/migrations/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
